---
name: Release
on:
  push:
    tags:
      - 'v*'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Compile all versions
        run: task release
      - name: Generate SBOM
        run: go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0 mod -licenses -json -output bom.json
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            bom.json
            .dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
